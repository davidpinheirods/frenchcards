services:
  db:
    image: mysql:8.0
    container_name: frenchcards-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    platform: linux/amd64
    container_name: frenchcards-backend
    restart: always
    environment:
      FLASK_APP: run.py
      FLASK_DEBUG: 1
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: frenchcards-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: frenchcards-phpmyadmin
    restart: always
    environment:
      PMA_HOST: db # Aponta para o serviço 'db'
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # Usa a mesma senha root do .env
    ports:
      - "8081:80" # Acesse o phpMyAdmin em http://localhost:8081
    depends_on:
      - db
  
volumes:
  db-data:
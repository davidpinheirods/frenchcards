<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="128x64" href="assets/favicon.png">
    <title>Frenchcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app">
        <div class="modo-container">
            <h1>
                <a href="#" id="logo-link">
                    <span class="title-color-bleu">Fren</span><span class="title-color-blanc">chc</span><span class="title-color-rouge">ards</span>
                </a>
            </h1>
            <div class="btn-group">
                <button id="btnEstudar" class="btn-modo">Todos os Cards</button>
                <button id="btnRevisao" class="btn-modo">Revisão</button>
                <button id="theme-toggle-button" class="btn-modo btn-theme">🌙</button>
                <button id="btn-toggle-view" class="btn-modo btn-icon hidden">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="3" width="8" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
                        <rect x="13" y="3" width="8" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </button>
            </div>
        </div>

        <div id="message-area" class="message hidden"></div>
        
        <div class="card-info-container hidden">
            <div id="card-counter" class="counter"></div>
            </div>

        <div id="card-scene" class="scene hidden">
            <div id="card" class="card">
                <div class="card-face card-front"></div>
                <div class="card-face card-back"></div>
            </div>
        </div>

        <div id="evaluation-buttons" class="evaluation-container disabled hidden">
            <button class="btn-eval" data-eval-id="1">Fácil</button>
            <button class="btn-eval" data-eval-id="2">Médio</button>
            <button class="btn-eval" data-eval-id="3">Difícil</button>
            <button class="btn-eval" data-eval-id="4">Não Lembro</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
